name: Tests

on:
  [push, pull_request]
  # Allows you to run this workflow manually from the Actions tab
  # workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
      fail-fast: false
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          architecture: x64

      - name: Setup
        run: pip install .[dev]

      - name: Lint
        run: black --diff --check --verbose .

      - name: Check schema is up to date
        if: matrix.python-version >= '3.9'
        run: |
          python3 -m fortls.schema
          git diff --exit-code ./fortls/fortls.schema.json

      - name: Unittests
        run: pytest --doctest-modules -n auto

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5.5.2
        with:
          # codecov.sh fetches Codecov's signing key with an unchecked
          # `curl -s https://keybase.io/codecovsecurity/pgp_keys.asc`. That URL
          # now returns 404 with the body "SELF-SIGNED PUBLIC KEY NOT FOUND",
          # which is piped into `gpg --import` as if it were a key, so the
          # signature check fails and the script exits 1. use_pypi installs the
          # CLI from PyPI and skips that download path entirely.
          use_pypi: true
          # Coverage is not worth failing someone's pull request over, and a
          # fork has no token to fix it with even when the upload itself works.
          fail_ci_if_error: ${{ secrets.CODECOV_TOKEN != '' }}
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
